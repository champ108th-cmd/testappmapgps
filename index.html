<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จุดส่งพัสดุ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>จุดส่งพัสดุ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--brand:#0f766e;--brand-d:#115e59;--bg:#fff;--fg:#1f2937;--muted:#6b7280;--line:#e5e7eb;--danger:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;color:var(--fg);background:var(--bg)}
  #map{position:absolute;inset:0;z-index:0}
  .topbar{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px}
  .topbar input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:0;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.25);background:#fff}
  .btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;font-family:inherit}
  .btn:active{background:var(--brand-d)}
  .btn[disabled]{opacity:.6}
  .btn.light{background:#fff;color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .btn.ghost{background:#f3f4f6;color:var(--fg)}
  .btn.danger{background:#fee2e2;color:var(--danger)}
  .fabs{position:absolute;z-index:500;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .fab{width:52px;height:52px;border-radius:50%;border:0;font-size:22px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
  .fab.main{width:auto;height:56px;border-radius:28px;padding:0 20px;background:var(--brand);color:#fff;font-size:16px;font-weight:700}
  .sheet-bg{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:none}
  .sheet-bg.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .sheet h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .sheet input[type=text],.sheet input[type=tel],.sheet textarea,.gate-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
  .row{display:flex;gap:8px;margin-top:14px}
  .row>*{flex:1}
  .coord{font-size:13px;color:var(--muted);margin-top:6px}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item .t{font-weight:700;font-size:16px}
  .item .s{font-size:14px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
  .item .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .item .acts .btn,.pop .btn{padding:9px 12px;font-size:14px;text-decoration:none;display:inline-block}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
  .pop{min-width:190px}
  .pop .t{font-weight:700;font-size:15px}
  .pop .s{font-size:13px;color:var(--muted);margin:2px 0;white-space:pre-wrap}
  .pop .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  #toast{position:fixed;z-index:1200;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;max-width:90%}
  .rbar{display:none;position:absolute;z-index:650;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.3);flex-direction:column;gap:10px}
  .rbar .rt{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rbar .rs{font-size:14px;color:var(--muted);margin-top:2px}
  .rbar .racts{display:flex;gap:8px;flex-wrap:wrap}
  .rbar .racts .btn{padding:10px 12px;font-size:14px;text-decoration:none;display:inline-block;text-align:center}
  .rbar .racts a.btn{flex:1}
  .me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.4)}
  /* photos */
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .photos .th{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#f3f4f6}
  .photos .th img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .th button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(17,24,39,.75);color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0}
  .photo-btns{display:flex;gap:8px;margin-top:8px}
  .photo-btns .btn{flex:1}
  .thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;background:#f3f4f6}
  #viewer{position:fixed;inset:0;z-index:1100;background:#000;display:none;flex-direction:column}
  #viewer.open{display:flex}
  #viewer .vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;color:#fff}
  #viewer .vbar span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewerBody{flex:1;overflow:auto;padding:0 8px calc(env(safe-area-inset-bottom) + 12px)}
  #viewerBody img{display:block;width:100%;max-width:900px;margin:0 auto 10px;border-radius:8px}
  #viewerBody .empty{color:#fff}
  /* login / status gate */
  #gate{position:fixed;inset:0;z-index:2000;background:#f0fdfa;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-box{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 30px rgba(0,0,0,.12)}
  .gate-box h1{margin:0 0 4px;font-size:22px}
  .gate-box p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
  .gate-box .btn{width:100%;margin-top:14px}
  .gate-err{color:var(--danger);font-size:14px;margin-top:10px;white-space:pre-wrap}
  .gate-box code{background:#f3f4f6;padding:1px 5px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <input id="q" type="search" placeholder="ค้นหา ที่อยู่ / ชื่อลูกค้า / หมายเหตุ">
  <button class="btn light" id="btnList">รายการ</button>
</div>

<div class="fabs">
  <button class="fab" id="btnLocate" title="ตำแหน่งของฉัน" aria-label="ตำแหน่งของฉัน">📍</button>
  <button class="fab main" id="btnAdd">＋ ปักหมุดตรงนี้</button>
</div>

<div id="tempBar" style="display:none;position:absolute;z-index:600;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);gap:10px">
  <button class="btn light" id="tempCancel" style="flex:0 0 auto">ยกเลิก</button>
  <button class="btn" id="tempSave" style="flex:1;height:56px;font-size:16px">📍 บันทึกจุดนี้</button>
</div>

<div class="rbar" id="routeBar">
  <div><div class="rt" id="routeTitle"></div><div class="rs" id="routeSub"></div></div>
  <div class="racts">
    <a class="btn" id="routeG" target="_blank" rel="noopener">เปิด Google Maps</a>
    <button class="btn ghost" id="routeRe">คำนวณใหม่</button>
    <button class="btn danger" id="routeX">ปิดเส้นทาง</button>
  </div>
</div>

<div class="sheet-bg" id="formBg"><div class="sheet" id="formSheet">
  <h2 id="formTitle">บันทึกจุดส่งพัสดุ</h2>
  <input type="hidden" id="fId">
  <label>ที่อยู่</label><textarea id="fAddr" rows="2" autocomplete="off" placeholder="บ้านเลขที่ ซอย ถนน แขวง/ตำบล เขต/อำเภอ"></textarea>
  <label>ชื่อลูกค้า</label><input type="text" id="fName" autocomplete="off">
  <label>เบอร์โทร</label><input type="tel" id="fPhone" autocomplete="off">
  <label>หมายเหตุ (เช่น ฝากไว้กับ รปภ., บ้านสีเขียวท้ายซอย)</label><textarea id="fNote" rows="3"></textarea>

  <label>รูปถ่าย (สูงสุด 3 รูป)</label>
  <div class="photos" id="fPhotos"></div>
  <div class="photo-btns" id="fPhotoAdd">
    <button type="button" class="btn ghost" id="fCam">📷 ถ่ายรูป</button>
    <button type="button" class="btn ghost" id="fPick">🖼 เลือกจากคลัง</button>
  </div>
  <input type="file" id="fCamIn" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="fPickIn" accept="image/*" multiple style="display:none">

  <div class="coord" id="fCoord"></div>
  <div class="row"><button class="btn ghost" id="fGps">ใช้ GPS ตอนนี้แทน</button></div>
  <div class="row">
    <button class="btn ghost" id="fCancel">ยกเลิก</button>
    <button class="btn" id="fSave">บันทึก</button>
  </div>
  <div class="row" id="fDelRow" style="display:none"><button class="btn danger" id="fDel">ลบจุดนี้</button></div>
</div></div>

<div class="sheet-bg" id="listBg"><div class="sheet">
  <h2>จุดส่งที่บันทึกไว้ (<span id="count">0</span>)</h2>
  <div id="list"></div>
  <div class="row">
    <button class="btn ghost" id="btnExport">สำรองข้อมูล</button>
    <button class="btn ghost" id="btnImport">นำเข้าข้อมูล</button>
  </div>
  <div class="row" id="migrateRow" style="display:none"><button class="btn ghost" id="btnMigrate">⬆️ ย้ายข้อมูลเดิมในเครื่องขึ้นระบบ</button></div>
  <div class="row">
    <button class="btn ghost" id="btnLogout">ออกจากระบบ</button>
    <button class="btn" id="btnCloseList">ปิด</button>
  </div>
  <div class="coord" id="whoami" style="text-align:center"></div>
  <input type="file" id="fileImport" accept="application/json" style="display:none">
</div></div>

<div id="viewer">
  <div class="vbar"><span id="viewerTitle"></span><button class="btn light" id="viewerClose">ปิด</button></div>
  <div id="viewerBody"></div>
</div>

<div id="gate"><div class="gate-box" id="gateBox" data-init="1"><h1>📦 จุดส่งพัสดุ</h1><p>กำลังเริ่มระบบ... ถ้าหน้านี้ค้างนานเกิน 10 วินาที ให้รีเฟรชหน้า</p></div></div>
<div id="toast"></div>

<script>
// แสดงข้อผิดพลาดบนหน้าจอ (แทนหน้าว่างเปล่า) ถ้ามีไฟล์โหลดไม่ได้หรือโค้ดพัง
(function(){
  function show(t,m){
    var g=document.getElementById('gate'),b=document.getElementById('gateBox');
    if(!g||!b||g.style.display==='none')return;
    if(b.getAttribute('data-final')||!b.hasAttribute('data-init'))return;   // ทำงานเฉพาะตอนแอปยังไม่ได้เข้าควบคุมหน้านี้
    b.setAttribute('data-final','1');
    var h=document.createElement('h1');h.textContent=t;
    var p=document.createElement('p');p.textContent=m;p.style.whiteSpace='pre-wrap';
    b.innerHTML='';b.appendChild(h);b.appendChild(p);
  }
  window.addEventListener('error',function(e){
    var el=e.target;
    if(el&&el!==window&&el.tagName){
      // สนใจเฉพาะไฟล์ script/css ที่โหลดไม่ได้ (รูปแผนที่/รูปอื่นโหลดพลาดเป็นเรื่องปกติ ไม่ต้องขึ้นหน้า error)
      if(el.tagName!=='SCRIPT'&&!(el.tagName==='LINK'&&/stylesheet/i.test(el.rel||'')))return;
      show('โหลดไฟล์ไม่สำเร็จ','ไม่สามารถโหลด: '+(el.src||el.href)+'\nตรวจสอบอินเทอร์เน็ต และว่าไฟล์อยู่ครบใน GitHub แล้วรีเฟรช');return}
    show('เกิดข้อผิดพลาดในแอป',(e.message||'unknown')+(e.filename?'\n('+e.filename.split('/').pop()+':'+e.lineno+')':''));
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;show('เกิดข้อผิดพลาดในแอป',(r&&r.message)||String(r));
  });
})();
</script>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var BUCKET='pin-photos', MAXP=3;
  var LOCAL_KEY='parcel_pins_v1';           // ข้อมูลเวอร์ชันเก่า (เก็บในเครื่อง) ใช้สำหรับย้ายขึ้นระบบ
  var CFG=window.APP_CONFIG||{};
  var sb=null, me=null, pins=[], photoCache={};

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},3200)}
  function errMsg(e){return (e&&(e.message||e.error_description||e.msg))||String(e)}
  function gmaps(p){return 'https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=driving'}
  function amaps(p){return 'https://maps.apple.com/?daddr='+p.lat+','+p.lng+'&dirflg=d'}
  function title(p){return p.name||p.address||'(ไม่มีชื่อ)'}
  function revoke(u){try{URL.revokeObjectURL(u)}catch(e){}}
  function newId(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
    var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
    var h=Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  function shortKey(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function migrateOld(p){if(p&&p.track!==undefined){if(!p.address&&p.track)p.address=p.track;delete p.track}return p}
  function dedupeKey(p){return [Number(p.lat).toFixed(6),Number(p.lng).toFixed(6),(p.address||'').trim(),(p.name||'').trim()].join('|')}

  /* ---------- Supabase data layer ---------- */
  function fromRow(r){
    return {id:r.id,address:r.address||'',name:r.name||'',phone:r.phone||'',note:r.note||'',
      lat:r.lat,lng:r.lng,photos:Array.isArray(r.photos)?r.photos:[],createdAt:r.created_at?Date.parse(r.created_at):0};
  }
  async function loadPins(){
    var r=await sb.from('pins').select('*').order('created_at',{ascending:false});
    if(r.error)throw r.error;
    pins=(r.data||[]).map(fromRow);
  }
  async function photoGet(path){
    if(photoCache[path])return photoCache[path];
    var r=await sb.storage.from(BUCKET).download(path);
    if(r.error)throw r.error;
    photoCache[path]=r.data;return r.data;
  }
  function blobToDataURL(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){res(null)};r.readAsDataURL(b)})}
  // ย่อรูปให้ด้านยาวไม่เกิน 1024px เป็น JPEG เพื่อประหยัดพื้นที่
  function compress(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,1024/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        revoke(url);
        c.toBlob(function(b){b?res(b):rej(new Error('ย่อรูปไม่สำเร็จ'))},'image/jpeg',0.72);
      };
      img.onerror=function(){revoke(url);rej(new Error('อ่านรูปไม่ได้'))};
      img.src=url;
    });
  }
  async function uploadPhoto(pinId,blob){
    var path=me.id+'/'+pinId+'/'+shortKey()+'.jpg';
    var r=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true});
    if(r.error)throw r.error;
    photoCache[path]=blob;
    return path;
  }
  async function removePhotos(paths){
    if(!paths||!paths.length)return;
    paths.forEach(function(p){delete photoCache[p]});
    try{await sb.storage.from(BUCKET).remove(paths)}catch(e){}
  }

  /* ---------- gate (login / status) ---------- */
  function showGate(html){var b=$('gateBox');b.removeAttribute('data-init');b.removeAttribute('data-final');b.innerHTML=html;$('gate').style.display='flex'}
  function hideGate(){$('gate').style.display='none'}
  function gateMsg(t,msg){showGate('<h1>'+esc(t)+'</h1><p style="white-space:pre-wrap">'+esc(msg)+'</p>')}
  function gateConfig(){
    showGate('<h1>ยังไม่ได้ตั้งค่า Supabase</h1>'
      +'<p>เปิดไฟล์ <code>config.js</code> แล้วใส่ <code>SUPABASE_URL</code> และ <code>SUPABASE_ANON_KEY</code> จาก Supabase (Project Settings → API) จากนั้นอัปโหลดไฟล์ขึ้น GitHub ใหม่</p>');
  }
  function gateError(msg){
    showGate('<h1>เชื่อมต่อไม่สำเร็จ</h1><p style="white-space:pre-wrap">'+esc(msg)+'</p>'
      +'<button class="btn" id="gRetry">ลองใหม่</button>'
      +'<button class="btn ghost" id="gOut">ออกจากระบบ</button>');
    $('gRetry').onclick=function(){enter()};
    $('gOut').onclick=function(){logout()};
  }
  function showLogin(msg){
    showGate('<h1>📦 จุดส่งพัสดุ</h1><p>เข้าสู่ระบบเพื่อดูและบันทึกจุดส่ง</p>'
      +'<form id="gForm" autocomplete="on">'
      +'<label>อีเมล</label><input type="email" id="gEmail" autocomplete="username" required>'
      +'<label>รหัสผ่าน</label><input type="password" id="gPass" autocomplete="current-password" required>'
      +'<button class="btn" id="gGo" type="submit">เข้าสู่ระบบ</button></form>'
      +'<div class="gate-err" id="gErr">'+esc(msg||'')+'</div>');
    $('gForm').onsubmit=async function(ev){
      ev.preventDefault();
      var btn=$('gGo');btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ...';$('gErr').textContent='';
      try{
        var r=await sb.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value});
        if(r.error)throw r.error;
        me=r.data.user||(r.data.session&&r.data.session.user);
        await enter();
      }catch(e){
        var m=errMsg(e);
        if(/invalid login/i.test(m))m='อีเมลหรือรหัสผ่านไม่ถูกต้อง';
        if($('gErr')){$('gErr').textContent=m;btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}
      }
    };
  }
  async function logout(){
    try{await sb.auth.signOut()}catch(e){}
    me=null;pins=[];photoCache={};
    closeList();closeForm();closeViewer();hideTemp();stopRoute();render(false);
    showLogin();
  }

  /* ---------- map ---------- */
  var map=L.map('map',{zoomControl:false}).setView([13.7563,100.5018],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  var layer=L.layerGroup().addTo(map);
  var markers={};
  var meMarker=null, tempMarker=null, meLatLng=null;

  function popupHtml(p){
    var n=(p.photos||[]).length;
    return '<div class="pop"><div class="t">'+esc(title(p))+'</div>'

  /* ---------- in-app route (OpenRouteService) ---------- */
  var ORS_URL='https://api.openrouteservice.org/v2/directions/driving-car/geojson';
  var routeLayer=null, routePin=null, routeSeq=0, watchId=null, arrivedToast=false;
  function fmtDist(m){return m>=1000?(m/1000).toFixed(m>=10000?0:1)+' กม.':Math.round(m)+' ม.'}
  function fmtTime(s){
    var mins=Math.max(1,Math.round(s/60));
    if(mins<60)return mins+' นาที';
    var h=Math.floor(mins/60),m=mins%60;
    return h+' ชม.'+(m?' '+m+' นาที':'');
  }
  function orsKey(){var k=cleanStr(CFG.ORS_API_KEY);return(!k||/YOUR_/i.test(k))?'':k}
  function orsError(status,body){
    var msg=(body&&body.error&&(body.error.message||body.error))||'';
    var code=body&&body.error&&body.error.code;
    if(status===401||status===403)return 'ORS_API_KEY ไม่ถูกต้องหรือถูกปิดใช้งาน ตรวจสอบใน config.js';
    if(status===429)return 'ใช้ ORS เกินโควตา (ต่อนาทีหรือต่อวัน) รอสักครู่แล้วลองใหม่';
    if(code===2010||/routable point/i.test(String(msg)))return 'หาถนนใกล้จุดนี้ไม่เจอ ลองปักหมุดให้ใกล้ถนนมากขึ้น';
    if(code===2004||/exceed/i.test(String(msg)))return 'ระยะทางไกลเกินที่ ORS คำนวณให้ได้';
    return 'คำนวณเส้นทางไม่สำเร็จ ('+status+') '+(typeof msg==='string'?msg:'');
  }
  function setRouteUI(on){

  function updateRouteSub(sum){
    var base=sum?(fmtDist(sum.distance)+' · '+fmtTime(sum.duration)):'';
    var line='';
    if(meLatLng&&routePin){line=' · ห่างเส้นตรง '+fmtDist(map.distance(meLatLng,[routePin.lat,routePin.lng]))}
    $('routeSub').textContent=base+line;

  function startWatch(){

    watchId=navigator.geolocation.watchPosition(function(pos){
      meLatLng=[pos.coords.latitude,pos.coords.longitude];showMe();

        var base=$('routeSub')._base||'';
        $('routeSub').textContent=base+' · ห่างเส้นตรง '+fmtDist(d);
        if(d<30&&!arrivedToast){arrivedToast=true;toast('ถึงจุดหมายแล้ว')}
      }
    },function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }

  function stopRoute(){

    routePin=null;arrivedToast=false;
    stopWatch();setRouteUI(false);

  async function fetchRoute(from,pin){
    var key=orsKey();
    var seq=++routeSeq;
    var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort()},20000);
    try{
      var res=await fetch(ORS_URL,{
        method:'POST',signal:ctrl.signal,
        headers:{'Authorization':key,'Content-Type':'application/json','Accept':'application/geo+json, application/json'},
        body:JSON.stringify({coordinates:[[from[1],from[0]],[pin.lng,pin.lat]],radiuses:[500,500]})
      });
      var j=null;try{j=await res.json()}catch(e){}
      if(seq!==routeSeq)return;
      if(!res.ok)throw new Error(orsError(res.status,j));
      var f=j&&j.features&&j.features[0];
      if(!f||!f.geometry)throw new Error('ไม่ได้รับเส้นทางจาก ORS');
      if(routeLayer)map.removeLayer(routeLayer);
      routeLayer=L.geoJSON(f,{style:{color:'#2563eb',weight:6,opacity:.85}}).addTo(map);
      routePin=pin;arrivedToast=false;
      $('routeTitle').textContent='ไปที่ '+title(pin);
      $('routeG').href=gmaps(pin);
      setRouteUI(true);
      updateRouteSub(f.properties.summary);
      try{map.fitBounds(routeLayer.getBounds(),{padding:[70,70]})}catch(e){}
      startWatch();
    }catch(e){
      if(seq!==routeSeq)return;
      toast(e&&e.name==='AbortError'?'ORS ตอบช้าเกินไป ลองใหม่อีกครั้ง':(e instanceof TypeError?'ติดต่อ ORS ไม่ได้ ตรวจสอบอินเทอร์เน็ต':errMsg(e)));
    }finally{clearTimeout(to)}
  }

    closeList();map.closePopup();hideTemp();
    getPos(function(ll){fetchRoute(ll,pin)});

  /* ---------- add pins in bulk (import backup / migrate old local data) ---------- */
  // list: pin objects, getBlobs(pin) -> Promise<Blob[]> ; returns number added
  async function addPinsBulk(list,getBlobs,onProgress){
    var have={};pins.forEach(function(p){have[dedupeKey(p)]=1});
    var fresh=list.filter(function(p){return p&&typeof p.lat==='number'&&typeof p.lng==='number'&&!have[dedupeKey(p)]});
    var added=0;
    for(var i=0;i<fresh.length;i++){
      var p=fresh[i];
      if(onProgress)onProgress(i+1,fresh.length);
      var id=newId(),paths=[],up=[];
      try{
        var blobs=(await getBlobs(p))||[];
        for(var j=0;j<blobs.length&&j<MAXP;j++){var pth=await uploadPhoto(id,blobs[j]);up.push(pth);paths.push(pth)}
        var row={id:id,address:p.address||'',name:p.name||'',phone:p.phone||'',note:p.note||'',lat:p.lat,lng:p.lng,photos:paths};
        var r=await sb.from('pins').insert(row);
        if(r.error)throw r.error;
        added++;
      }catch(e){await removePhotos(up);throw e}
    }
    await loadPins();render(false);
    return added;
  }

  $('btnExport').onclick=async function(){

    try{
      var out=[];
      for(var i=0;i<pins.length;i++){
        var p=pins[i],c=JSON.parse(JSON.stringify(p));c.photoData={};
        for(var j=0;j<(p.photos||[]).length;j++){
          try{var b=await photoGet(p.photos[j]);var u=await blobToDataURL(b);if(u)c.photoData[p.photos[j]]=u}catch(e){}
        }
        out.push(c);
      }
      var blob=new Blob([JSON.stringify({version:3,pins:out})],{type:'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='parcel-pins-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){revoke(a.href)},3000);
      toast('สำรองข้อมูลแล้ว');
    }catch(e){toast('สำรองข้อมูลไม่สำเร็จ: '+errMsg(e))}
  };
  $('btnImport').onclick=function(){$('fileImport').click()};
  $('fileImport').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    var r=new FileReader();
    r.onload=async function(){
      var arr;
      try{var j=JSON.parse(r.result);arr=Array.isArray(j)?j:j.pins;if(!Array.isArray(arr))throw 0}catch(e){toast('ไฟล์ไม่ถูกต้อง');return}
      arr.forEach(migrateOld);
      try{
        var n=await addPinsBulk(arr,async function(p){
          var pd=p.photoData||{},ids=(p.photos||[]).filter(function(id){return pd[id]}),blobs=[];
          for(var i=0;i<ids.length;i++){try{blobs.push(await (await fetch(pd[ids[i]])).blob())}catch(e){}}
          return blobs;
        },function(i,t){toast('กำลังนำเข้า '+i+'/'+t+' ...')});
        toast('นำเข้า '+n+' รายการ');
      }catch(e){toast('นำเข้าไม่สำเร็จ: '+errMsg(e))}
    };
    r.readAsText(f);
  };

  /* ---------- migrate old on-device data (เวอร์ชันเก่าที่เก็บในเครื่อง) ---------- */
  function oldPhotoGet(id){
    return new Promise(function(res){
      if(!window.indexedDB){res(null);return}
      var rq=indexedDB.open('parcel_photos_v1',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('photos',{keyPath:'id'})};
      rq.onerror=function(){res(null)};
      rq.onsuccess=function(){
        try{
          var g=rq.result.transaction('photos','readonly').objectStore('photos').get(id);
          g.onsuccess=function(){res(g.result&&g.result.blob||null)};g.onerror=function(){res(null)};
        }catch(e){res(null)}
      };
    });
  }
  async function migrateLocal(){
    var d;try{d=JSON.parse(localStorage.getItem(LOCAL_KEY))}catch(e){d=null}
    if(!Array.isArray(d)||!d.length){toast('ไม่พบข้อมูลเดิมในเครื่อง');return}
    d.forEach(migrateOld);
    try{
      var n=await addPinsBulk(d,async function(p){
        var blobs=[],ids=p.photos||[];
        for(var i=0;i<ids.length;i++){var b=await oldPhotoGet(ids[i]);if(b)blobs.push(b)}
        return blobs;
      },function(i,t){toast('กำลังย้ายข้อมูล '+i+'/'+t+' ...')});
      try{localStorage.setItem('parcel_migrated_'+me.id,'1')}catch(e){}
      toast('ย้ายขึ้นระบบแล้ว '+n+' รายการ (ข้อมูลเดิมในเครื่องยังไม่ถูกลบ)');
      $('migrateRow').style.display='none';
    }catch(e){toast('ย้ายข้อมูลไม่สำเร็จ: '+errMsg(e))}
  }
  $('btnMigrate').onclick=function(){if(confirm('ย้ายข้อมูลเดิมที่บันทึกไว้ในเครื่องนี้ขึ้นระบบ?'))migrateLocal()};

  /* ---------- boot ---------- */
  var firstEnter=true, lastRefresh=0;
  async function enter(){
    gateMsg('กำลังโหลดข้อมูล...','');
    try{
      await loadPins();
    }catch(e){gateError(errMsg(e));return}
    hideGate();lastRefresh=Date.now();
    render(firstEnter||true);
    if(!pins.length&&navigator.geolocation){
      navigator.geolocation.getCurrentPosition(function(pos){meLatLng=[pos.coords.latitude,pos.coords.longitude];showMe();map.setView(meLatLng,15)},function(){}, {timeout:8000});
    }
    firstEnter=false;
    var flag=null;try{flag=localStorage.getItem('parcel_migrated_'+me.id)}catch(e){}
    var n=localPinsCount();
    if(n&&!flag){
      try{localStorage.setItem('parcel_migrated_'+me.id,'asked')}catch(e){}
      if(confirm('พบข้อมูลเดิมที่บันทึกไว้ในเครื่อง '+n+' จุด ต้องการย้ายขึ้นระบบหรือไม่?'))migrateLocal();
    }
  }
  /* config normalisation: ตัดช่องว่าง/เครื่องหมายคำพูด, เติม https://, ดึง URL จากลิงก์ Dashboard, ตรวจ key ผิดชนิด */
  function cleanStr(x){return String(x==null?'':x).replace(/[\s'"“”‘’]/g,'')}
  function normUrl(u){
    u=cleanStr(u);if(!u)return '';
    var m=u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
    if(m)return 'https://'+m[1].toLowerCase()+'.supabase.co';
    if(!/^https?:\/\//i.test(u)){u=(/^[a-z0-9]{15,30}$/i.test(u)?u+'.supabase.co':u);u='https://'+u}
    try{var o=new URL(u);return o.hostname.indexOf('.')>0?o.origin:''}catch(e){return ''}
  }
  function keyProblem(k){
    if(!k)return 'ยังไม่ได้ใส่ SUPABASE_ANON_KEY';
    if(/^sb_secret_/i.test(k))return 'คุณใส่ secret key ซึ่งห้ามใช้ในแอปนี้ ให้ใช้ anon public key (หรือ publishable key) แทน';
    var parts=k.split('.');
    if(parts.length===3){
      try{
        var pl=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
        if(pl.role==='service_role')return 'คุณใส่ service_role key ซึ่งห้ามใช้ในแอปนี้ ให้ใช้ anon public key แทน (และควรสร้าง key ใหม่ เพราะ key นี้เปิดเผยแล้ว)';
      }catch(e){}
    }else if(!/^sb_publishable_/i.test(k)){
      return 'รูปแบบ key ไม่ถูกต้อง (ควรขึ้นต้นด้วย eyJ... หรือ sb_publishable_...)';
    }
    return '';
  }
  function diagLine(){return '\nURL ที่ใช้: '+(CFG._url||'(ว่าง)')+'\nKey: '+(CFG._key?CFG._key.slice(0,14)+'...':'(ว่าง)')}
  function withTimeout(promise,ms,msg){
    return Promise.race([promise,new Promise(function(_,rej){setTimeout(function(){rej(new Error(msg))},ms)})]);
  }
  async function boot(){
    try{
      if(typeof L==='undefined'){gateMsg('โหลดแผนที่ไม่สำเร็จ','ไม่สามารถโหลดไลบรารีแผนที่ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช');return}
      CFG._url=normUrl(CFG.SUPABASE_URL);CFG._key=cleanStr(CFG.SUPABASE_ANON_KEY);
      if(/YOUR_SUPABASE/i.test(String(CFG.SUPABASE_URL)+String(CFG.SUPABASE_ANON_KEY))||(!CFG.SUPABASE_URL&&!CFG.SUPABASE_ANON_KEY)){gateConfig();return}
      if(/^(sb_|eyJ)/i.test(cleanStr(CFG.SUPABASE_URL))){gateMsg('ใส่ key ผิดช่อง','ในไฟล์ config.js ช่อง SUPABASE_URL ถูกใส่ค่าเป็น key ให้เปลี่ยนเป็น Project URL ที่หน้าตาแบบ https://xxxxxxxx.supabase.co (ดูได้ที่ Supabase → Project Settings → API) ส่วนช่อง SUPABASE_ANON_KEY ใช้ key ได้ตามเดิม');return}
      if(!CFG._url){gateMsg('SUPABASE_URL ไม่ถูกต้อง','ใน config.js ให้ใส่ Project URL เช่น https://abcdefghijklmno.supabase.co'+diagLine());return}
      var kp=keyProblem(CFG._key);
      if(kp){gateMsg('SUPABASE_ANON_KEY ไม่ถูกต้อง',kp+diagLine());return}
      if(!window.supabase||!window.supabase.createClient){gateMsg('โหลดระบบฐานข้อมูลไม่สำเร็จ','ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้');return}
      sb=window.supabase.createClient(CFG._url,CFG._key);
      sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&me){me=null;pins=[];render(false);showLogin()}});
      var r=await withTimeout(sb.auth.getSession(),10000,'เชื่อมต่อ Supabase ช้าผิดปกติ ตรวจสอบ URL/Key และว่าโปรเจกต์ไม่ได้ถูกพัก (Paused)');
      if(r.data&&r.data.session){me=r.data.session.user;await enter()}else showLogin();
    }catch(e){
      gateError(errMsg(e)+diagLine());
    }
  }
  // กลับมาเปิดแอปอีกครั้ง -> โหลดข้อมูลล่าสุด (ใช้ได้หลายเครื่อง)
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible'||!me||saving)return;
    if($('formBg').classList.contains('open')||Date.now()-lastRefresh<30000)return;
    lastRefresh=Date.now();
    loadPins().then(function(){render(false)}).catch(function(){});
  });
  boot();
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
